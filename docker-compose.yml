services:

  postgres:
    image: postgres:18.6
    container_name: husi-postgres

    environment:
      POSTGRES_DB: husi
      POSTGRES_USER: husi
      POSTGRES_PASSWORD: husi_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - husi_network


  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: husi-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@husi.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json

    networks:
      - husi_network


volumes:
  postgres_data:
  pgadmin_data:


networks:
  husi_network: