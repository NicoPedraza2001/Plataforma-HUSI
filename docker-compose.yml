services:

  postgres:
    image: postgres:18.6
    container_name: husi-postgres

    environment:
      POSTGRES_DB: husi
      POSTGRES_USER: husi
      POSTGRES_PASSWORD: husi_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

      # Scripts de creacion y carga inicial. La imagen de PostgreSQL los
      # ejecuta en orden alfabetico UNA sola vez: cuando el volumen
      # postgres_data esta vacio. Para volver a correrlos hay que borrar el
      # volumen (docker compose down -v).
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # Por TCP: mientras corren los scripts de init Postgres solo escucha
      # en el socket local, asi que no se reporta sano antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U husi -d husi"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - husi_network


  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: husi-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@husi.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json

    networks:
      - husi_network


  backend:
    # Imagen construida desde backend/Dockerfile. Tras cambiar el codigo:
    #   docker compose up -d --build backend
    build: ./backend
    image: husi-backend
    container_name: husi-backend

    environment:
      # Perfil dev, pero apuntando al contenedor de Postgres en vez de localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://husi-postgres:5432/husi
      # Contrasena del primer inicio de sesion de admin@husi.com. Se lee del
      # archivo .env (ignorado por git; ver .env.example) o de la variable de
      # entorno de la terminal. Solo se usa mientras el admin no tenga
      # contrasena; despues se cambia desde la pantalla de Usuarios.
      HUSI_ADMIN_CONTRASENA_INICIAL: ${HUSI_ADMIN_CONTRASENA_INICIAL:-}

    ports:
      - "8080:8080"

    # Espera a que la base termine los scripts de database/init; si no,
    # Hibernate valida el esquema contra una base vacia y no arranca.
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - husi_network


volumes:
  postgres_data:
  pgadmin_data:


networks:
  husi_network: