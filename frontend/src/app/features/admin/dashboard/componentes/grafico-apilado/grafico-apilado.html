<div class="apilada" role="img" [attr.aria-label]="resumen()">
  @for (segmento of segmentos(); track segmento.etiqueta; let indice = $index) {
    <span
      class="apilada__seg"
      [class]="'apilada__seg--' + (indice + 1)"
      [style.flex-grow]="segmento.porcentaje"
    ></span>
  }
</div>

<ul class="leyenda">
  @for (segmento of segmentos(); track segmento.etiqueta; let indice = $index) {
    <li class="leyenda__fila">
      <span
        class="leyenda__punto"
        [class]="'leyenda__punto--' + (indice + 1)"
        aria-hidden="true"
      ></span>
      <span class="leyenda__texto">{{ segmento.etiqueta }}</span>
      <span class="leyenda__valor">{{ segmento.porcentaje }}%</span>
    </li>
  }
</ul>
