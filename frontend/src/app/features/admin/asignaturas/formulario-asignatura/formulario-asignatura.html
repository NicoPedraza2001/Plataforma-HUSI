<form #form="ngForm" (ngSubmit)="form.valid && guardar.emit()">
  <fieldset [disabled]="guardando()">
    <label
      >Nombre de la asignatura<input
        name="nombre"
        [(ngModel)]="datos().nombre"
        required
        maxlength="200"
        pattern=".*\S.*"
        #nombre="ngModel"
    /></label>
    @if (nombre.invalid && (nombre.touched || form.submitted)) {
      <p class="mensaje error">Ingresa un nombre de hasta 200 caracteres.</p>
    }
    <label
      >Servicio<select name="servicioId" [(ngModel)]="datos().servicioId" required>
        <option [ngValue]="null">Selecciona un servicio</option>
        @for (opcion of servicios(); track opcion.id) {
          <option [ngValue]="opcion.id">{{ opcion.nombre }}</option>
        }
      </select></label
    >
    @if (!servicios().length) {
      <p class="mensaje">No hay servicios activos. Registra o activa uno en Servicios.</p>
    }
  </fieldset>
  @if (errorFormulario()) {
    <p class="mensaje error" role="alert">{{ errorFormulario() }}</p>
  }
  <footer>
    <button
      type="button"
      class="btn btn--outline"
      [disabled]="guardando()"
      (click)="cancelar.emit()"
    >
      Cancelar</button
    ><button type="submit" class="btn btn--navy" [disabled]="form.invalid || guardando()">
      {{ guardando() ? 'Guardando…' : 'Guardar' }}
    </button>
  </footer>
</form>
