<form #form="ngForm" (ngSubmit)="form.valid && guardar.emit()">
  <label for="residente-nombre">Nombre completo</label
  ><input
    id="residente-nombre"
    name="nombre"
    type="text"
    maxlength="200"
    required
    [disabled]="guardando()"
    [(ngModel)]="datos().nombre"
  />
  <label for="residente-tipoDocumento">Tipo de documento</label
  ><select
    id="residente-tipoDocumento"
    name="tipoDocumento"
    required
    [disabled]="guardando()"
    [(ngModel)]="datos().tipoDocumento"
  >
    @for (tipo of tiposDocumento(); track tipo.id) {
      <option [ngValue]="tipo.codigo">{{ tipo.codigo }} — {{ tipo.nombre }}</option>
    }
  </select>
  <label for="residente-numeroDocumento">Número de documento</label
  ><input
    id="residente-numeroDocumento"
    name="numeroDocumento"
    type="text"
    maxlength="50"
    required
    [disabled]="guardando()"
    [(ngModel)]="datos().numeroDocumento"
  />
  <label for="residente-perfilAcademico">Perfil académico</label
  ><select
    id="residente-perfilAcademico"
    name="perfilAcademico"
    [disabled]="guardando()"
    [(ngModel)]="datos().perfilAcademico"
  >
    <option [ngValue]="''">Sin especificar</option>
    @for (perfil of perfiles(); track perfil.id) {
      <option [ngValue]="perfil.nombre">{{ perfil.nombre }}</option>
    }
  </select>
  <label for="residente-programaId">Programa</label
  ><select
    id="residente-programaId"
    name="programaId"
    required
    [disabled]="guardando()"
    [(ngModel)]="datos().programaId"
  >
    <option [ngValue]="null">Selecciona una opción</option>
    @for (opcion of opciones(); track opcion.id) {
      <option [ngValue]="opcion.id">{{ opcion.nombre }}</option>
    }
  </select>
  @if (errorFormulario()) {
    <p class="mensaje error" role="alert">{{ errorFormulario() }}</p>
  }
  @if (form.invalid && form.touched) {
    <p class="mensaje error" role="alert">
      Revisa los campos obligatorios, el formato y las longitudes permitidas. No se admiten campos
      obligatorios con solo espacios.
    </p>
  }
  <footer>
    <button
      type="button"
      class="btn btn--outline"
      [disabled]="guardando()"
      (click)="cancelar.emit()"
    >
      Cancelar</button
    ><button class="btn btn--navy" type="submit" [disabled]="guardando() || form.invalid">
      {{ guardando() ? 'Guardando…' : 'Guardar' }}
    </button>
  </footer>
</form>
