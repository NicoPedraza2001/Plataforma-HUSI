<!-- ===================== BARRA LATERAL ===================== -->
<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__brand-name">HUSI</span>
    <span class="sidebar__brand-tag">Gestion de residentes</span>
  </div>

  <nav class="sidebar__nav" aria-label="Navegación del administrador">
    @for (grupo of navGroups; track grupo.id) {
      @if (grupo.title) {
        <h2 class="sidebar__group-title">{{ grupo.title }}</h2>
      }

      <ul class="sidebar__list">
        @for (item of grupo.items; track item.link) {
          <li>
            <a class="nav-item" [routerLink]="item.link" routerLinkActive="nav-item--active">
              <span class="nav-item__dot" aria-hidden="true"></span>
              <span class="nav-item__label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </nav>
</aside>

<!-- ===================== CONTENIDO ===================== -->
<main class="admin-main">
  <router-outlet />
</main>
