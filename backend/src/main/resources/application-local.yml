# Base independiente y temporal: no modifica PostgreSQL. Se reinicia al cerrar Java.
spring:
  devtools:
    restart:
      enabled: false
  datasource:
    url: jdbc:h2:mem:husi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema.sql
      data-locations: classpath:db/local/data.sql
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
