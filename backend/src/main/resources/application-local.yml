# Base independiente y temporal: no modifica PostgreSQL. Se reinicia al cerrar Java.
spring:
  devtools:
    restart:
      enabled: false
  datasource:
    # OPTIMIZE_REUSE_RESULTS=0: sin esto, H2 repite el resultado de un select exists(...) aunque
    # la tabla haya cambiado en la misma sesión.
    url: jdbc:h2:mem:husi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;OPTIMIZE_REUSE_RESULTS=0;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema.sql
      data-locations: classpath:db/local/data.sql
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  servlet:
    session:
      cookie:
        secure: false
husi:
  seguridad:
    documentacion-publica: true
