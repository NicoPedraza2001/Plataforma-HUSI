# ============================================================
# Despliegue. Ningun dato sensible queda escrito en el repositorio:
# todo se inyecta por variables de entorno.
# ============================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    co.edu.javeriana.husi: INFO

husi:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
